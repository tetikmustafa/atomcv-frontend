name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # node:22 and setup-node still bundle npm 10, which reads this lock file
      # differently from the npm 11 that wrote it and reports its optional
      # native packages as missing. Pinning keeps CI, the Docker image and a
      # developer machine consistent.
      - run: npm install -g npm@11.6.2

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Runs `next typegen` first: PageProps and LayoutProps are generated
      # into .next/types, and a clean checkout has none of them.
      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Reads the prerendered output the build just produced, so it must not
      # rebuild. `npm run size` is the local convenience wrapper that does.
      - name: Bundle budget
        run: npm run size:check

  # The guard whose absence let the schema get ahead of the documentation
  # (`B-101`, and `F-038` is what that cost). It stood as a TODO from Stage 0
  # until `openapi.json` reached the backend's repository root.
  #
  # **`main`, not `build`.** The backend's own job pointed at
  # `.../build/openapi.json` -- a generated, gitignored path -- so the URL was
  # a permanent 404 and the check took its "skipping" branch every time. A
  # guard that skips is worse than no guard: it reports success.
  #
  # The committed copy is verified against the published schema by
  # `OpenApiDocumentIT` on every backend PR, so this is comparing against
  # something that cannot itself be stale.
  contract:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm install -g npm@11.6.2
      - run: npm ci

      # `--fail-with-body` so a 404 fails the step rather than writing an
      # error page into the file and letting the generator make types out of
      # it. Silence is the failure mode this whole job exists to remove.
      - name: Fetch the backend's published schema
        run: |
          curl --fail-with-body --silent --show-error --location \
            --output openapi.json \
            https://raw.githubusercontent.com/tetikmustafa/atomcv-backend/main/openapi.json

      - name: Regenerate and compare
        run: |
          npm run gen:api:ci
          if ! git diff --quiet -- src/types/api.d.ts; then
            echo "::error::src/types/api.d.ts is behind the backend's schema. Run 'npm run gen:api' against a running backend and commit the result."
            git --no-pager diff -- src/types/api.d.ts
            exit 1
          fi

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # node:22 and setup-node still bundle npm 10, which reads this lock file
      # differently from the npm 11 that wrote it and reports its optional
      # native packages as missing. Pinning keeps CI, the Docker image and a
      # developer machine consistent.
      - run: npm install -g npm@11.6.2

      - run: npm ci

      # `--with-deps` runs `apt-get update`, and the runner image ships
      # Google's `chrome-stable` apt source. On 2026-09-09 that repository
      # served a `Packages.gz` whose hash did not match the one its own
      # `InRelease` declares, so apt exited 100 and this step failed twice in
      # a row with nothing wrong on our side.
      #
      # The source is **dropped rather than waited out**: Playwright downloads
      # its own Chromium build, and `--with-deps` only needs the Ubuntu
      # archives for the shared libraries around it. Nothing here has ever
      # installed Google's package, so a third party's index is a dependency
      # this job should not have had.
      #
      # Matched by content rather than by filename — the image has used both
      # `google-chrome.list` and a deb822 `.sources` file — and the `|| true`
      # is for the day it stops being there at all: `grep` exits 1 on no match
      # and the step's shell runs with `pipefail`.
      - name: Install Chromium
        run: |
          grep -rlF dl.google.com /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f || true
          npx playwright install --with-deps chromium

      # Playwright starts its own dev server (playwright.config.ts). MSW is
      # disabled in production builds by design, so these run against `next
      # dev` — without it there is no API to test against at all.
      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
